name: Deploy MeshCall to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite application for GitHub Pages
        run: npm run build -- --base=/meshcall/
        # Optional runtime config from repository Settings → Variables (Actions).
        # NOTE: VITE_* values are compiled into the public bundle – never put long-lived secrets here.
        env:
          VITE_SCALEDRONE_CHANNEL_ID: ${{ vars.VITE_SCALEDRONE_CHANNEL_ID }}
          VITE_STUN_SERVER: ${{ vars.VITE_STUN_SERVER }}
          VITE_TURN_SERVER: ${{ vars.VITE_TURN_SERVER }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL }}
          VITE_PUSH_SERVER_URL: ${{ vars.VITE_PUSH_SERVER_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Ensure SPA fallback exists
        shell: bash
        run: |
          if [[ -f dist/index.html && ! -f dist/404.html ]]; then
            cp dist/index.html dist/404.html
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
